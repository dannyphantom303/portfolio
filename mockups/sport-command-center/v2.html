<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sport Command Center — v2 Mockup</title>
<style>
  :root{
    --bg:#F6F3ED; --panel:#FFFFFF; --panel2:#FBF9F4; --ink:#1A1510; --muted:#7B7069;
    --line:#E6DED1; --line2:#EFE9DE; --gold:#A9781F; --gold-soft:#F6ECD6; --gold-ink:#7A5514;
    --green:#2E7D4F; --green-soft:#E4F1E9; --red:#B23A2E; --red-soft:#FAE8E4;
    --amber:#A97400; --amber-soft:#FCF1D6; --blue:#2F5AA8; --blue-soft:#E7EEFA;
    --tmg:#C9911A; --peril:#3F6B4A; --deck:#2F5AA8; --film:#7A4FA0; --port:#0E7C86;
    --shadow:0 1px 2px rgba(26,21,16,.05), 0 8px 24px rgba(26,21,16,.05);
    --radius:14px;
  }
  body[data-theme="dark"]{
    --bg:#0E1012; --panel:#16191C; --panel2:#1B1F23; --ink:#EDEAE4; --muted:#8B949C;
    --line:#262B31; --line2:#1F2429; --gold:#D8A54A; --gold-soft:#2A2317; --gold-ink:#E7C27F;
    --green:#5FBF8A; --green-soft:#16281F; --red:#E4796A; --red-soft:#2A1A18;
    --amber:#DDAE55; --amber-soft:#2A2317; --blue:#7EA6E8; --blue-soft:#182236;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
    display:flex; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  /* ---------------- sidebar ---------------- */
  .sidebar{
    width:246px; flex:0 0 246px; height:100vh; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 12px 12px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .mark{
    width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--gold),#7d5514);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;
  }
  .brand .bt{font-weight:750;font-size:15px;letter-spacing:-.2px;line-height:1.15}
  .brand .bs{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .nav{flex:1;overflow-y:auto;padding-right:2px}
  .nav-label{
    font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted); padding:14px 10px 7px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:9px;
    color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:520;position:relative;
  }
  .nav-item:hover{background:var(--panel2)}
  .nav-item.on{background:var(--gold-soft);color:var(--gold-ink);font-weight:650}
  .nav-item.on::before{
    content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--gold);
  }
  .ni{width:17px;text-align:center;font-size:14px;opacity:.9}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--gold)}
  .badge{
    margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;
    background:var(--gold-soft);color:var(--gold-ink);min-width:22px;text-align:center;
  }
  .badge.red{background:var(--red-soft);color:var(--red)}
  .badge.grey{background:var(--line2);color:var(--muted)}
  .side-foot{border-top:1px solid var(--line2);padding:10px 8px 4px;display:flex;align-items:center;gap:9px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:750;font-size:12px}
  .side-foot .nm{font-size:12.5px;font-weight:650}
  .side-foot .rl{font-size:11px;color:var(--muted)}

  /* ---------------- shell ---------------- */
  .app{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
  .topbar{
    height:60px;flex:0 0 60px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:14px;padding:0 22px;
  }
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:650}
  .ask{
    margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:330px;color:var(--muted);font-size:13px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;
    padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
  }
  .pill.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
  .pill.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
  .pill.bad{background:var(--red-soft);border-color:transparent;color:var(--red)}
  .main{flex:1;overflow-y:auto;padding:26px 26px 40px}
  .wrap{max-width:1240px;margin:0 auto}

  h1{font-size:25px;font-weight:780;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
    padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.danger{color:var(--red);border-color:var(--line)}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
    padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  }

  /* ---------------- today ---------------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .kl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .kv{font-size:26px;font-weight:780;letter-spacing:-1px;margin:5px 0 2px}
  .kpi .kn{font-size:12px;color:var(--muted)}
  .kpi.alert .kv{color:var(--red)}
  .focus{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:20px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2)}
  .panel-h h3{font-size:14px;font-weight:720;letter-spacing:-.1px}
  .focus-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
  .focus-item:last-child{border-bottom:0}
  .fi-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 32px}
  .fi-t{font-weight:660;font-size:13.5px}
  .fi-d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .sport-note{padding:16px;background:linear-gradient(150deg,var(--gold-soft),transparent 70%);border-radius:0}
  .sport-note p{font-size:13px;line-height:1.6}
  .sport-note .q{color:var(--muted);font-size:12.5px;margin-top:8px}
  .ventures{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
  .vcard:hover{border-color:var(--gold)}
  .vcard .vtop{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .vico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px}
  .vname{font-weight:700;font-size:13.5px;letter-spacing:-.1px}
  .vsub{font-size:11.5px;color:var(--muted)}
  .vfoot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .bar{height:3px;border-radius:3px;background:var(--line2);flex:1;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}

  /* ---------------- approvals ---------------- */
  .appr{display:grid;grid-template-columns:196px 1fr 380px;gap:16px;align-items:start}
  .filters{padding:8px}
  .f-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px 5px}
  .f-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink)}
  .f-item:hover{background:var(--panel2)}
  .f-item.on{background:var(--gold-soft);color:var(--gold-ink);font-weight:650}
  .f-item .c{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:650}
  .f-item.on .c{color:var(--gold-ink)}
  .qlist{padding:0;overflow:hidden}
  .qhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);background:var(--panel2)}
  .qhead .sel{font-size:12.5px;color:var(--muted)}
  .arow{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:center}
  .arow:hover{background:var(--panel2)}
  .arow.on{background:var(--gold-soft)}
  .arow:last-child{border-bottom:0}
  .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);flex:0 0 15px;background:var(--panel)}
  .thumb{width:44px;height:44px;border-radius:8px;flex:0 0 44px;background:linear-gradient(140deg,#d8b46a,#8a5f22);position:relative;overflow:hidden}
  .thumb.b{background:linear-gradient(140deg,#7ba98a,#2f5540)}
  .thumb.c{background:linear-gradient(140deg,#9db3d8,#2f5aa8)}
  .thumb.d{background:linear-gradient(140deg,#c7a6d8,#5b3a7a)}
  .arow .amain{min-width:0;flex:1}
  .arow .at{font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow .am{font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:center;margin-top:2px;flex-wrap:wrap}
  .vdot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .preview{padding:0;overflow:hidden;position:sticky;top:0}
  .pimg{height:196px;background:linear-gradient(150deg,#e2c07a,#9a6b22);position:relative}
  .pimg::after{content:"1080 × 1350";position:absolute;right:8px;bottom:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.42);padding:2px 6px;border-radius:4px}
  .pbody{padding:15px 16px}
  .pbody .pt{font-weight:720;font-size:14px;margin-bottom:6px}
  .pcap{font-size:12.5px;line-height:1.55;color:var(--ink);opacity:.9}
  .phash{font-size:12px;color:var(--blue);margin-top:8px;word-break:break-word}
  .mrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .pact{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);background:var(--panel2);flex-wrap:wrap}
  .pact .btn{flex:1;justify-content:center}
  .batch{
    margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:var(--blue-soft);
    font-size:12px;color:var(--blue);display:flex;align-items:center;gap:8px;justify-content:space-between;
  }

  /* ---------------- health ---------------- */
  .health-top{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .htile{padding:14px 16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
  .htile .hl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .htile .hv{font-size:22px;font-weight:780;letter-spacing:-.6px;margin-top:4px}
  .htile .hs{font-size:12px;color:var(--muted);margin-top:1px}
  .hgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
  .attn{padding:0}
  .attn-row{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
  .attn-row:last-child{border-bottom:0}
  .sev{width:6px;align-self:stretch;border-radius:6px;background:var(--amber);flex:0 0 6px}
  .sev.red{background:var(--red)}
  .attn-t{font-size:13px;font-weight:660}
  .attn-d{font-size:12px;color:var(--muted);margin-top:2px}
  .svc{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2);font-size:12.5px}
  .svc:last-child{border-bottom:0}
  .svc .sname{flex:1;font-weight:560}
  .uptime{display:flex;gap:2px}
  .uptime i{width:3px;height:14px;border-radius:1px;background:var(--green);opacity:.85}
  .uptime i.miss{background:var(--red);opacity:.8}
  table.jobs{width:100%;border-collapse:collapse;font-size:12.5px}
  table.jobs th{
    text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--panel2);
  }
  table.jobs td{padding:9px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.jobs tr:last-child td{border-bottom:0}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650}
  .st.ok{color:var(--green)} .st.bad{color:var(--red)} .st.pause{color:var(--muted)} .st.warn{color:var(--amber)}

  /* ---------------- chat ---------------- */
  .chatwrap{display:grid;grid-template-columns:1fr 296px;gap:18px;height:calc(100vh - 130px);min-height:520px}
  .chat{display:flex;flex-direction:column;overflow:hidden}
  .chat-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
  .msgs{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .mav{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;font-size:11px;font-weight:750;background:var(--gold-soft);color:var(--gold-ink)}
  .msg.me .mav{background:var(--line2);color:var(--muted)}
  .bub{background:var(--panel2);border:1px solid var(--line2);padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.6}
  .msg.me .bub{background:var(--gold);color:#fff;border-color:transparent}
  .bub ul{margin:7px 0 0 16px}
  .bub li{margin-bottom:5px}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tool{font-size:11px;font-family:ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
  .composer{border-top:1px solid var(--line2);padding:12px 14px;display:flex;gap:9px;align-items:center}
  .composer .box{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:13px;background:var(--panel2);display:flex;align-items:center;gap:8px}
  .profs{padding:0;overflow:hidden}
  .prof{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:center}
  .prof:hover{background:var(--panel2)}
  .prof.on{background:var(--gold-soft)}
  .prof:last-child{border-bottom:0}
  .pav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:750;flex:0 0 28px}
  .prof .pn{font-size:12.5px;font-weight:650}
  .prof .pr{font-size:11px;color:var(--muted);line-height:1.35}
  .prof .live{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;flex:0 0 6px}

  /* ---------------- project ---------------- */
  .phead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
  .pico{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:24px;flex:0 0 52px}
  .ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
  .ptab{padding:9px 13px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:560}
  .ptab.on{color:var(--gold-ink);border-bottom-color:var(--gold);font-weight:680}
  .pcols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
  .act{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;align-items:flex-start}
  .act:last-child{border-bottom:0}
  .act .tm{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
  .mini{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:12.5px}
  .mini:last-child{border-bottom:0}
  .mini a{color:var(--gold-ink);font-weight:600}
  .note{font-size:11.5px;color:var(--muted);padding:12px 16px;background:var(--panel2);border-top:1px solid var(--line2)}

  /* ---------------- phone / glasses-width ---------------- */
  @media (max-width:760px){
    .sidebar{display:none}
    .topbar{height:52px;flex:0 0 52px;padding:0 14px}
    .ask{display:none}
    .main{padding:16px 14px 60px}
    h1{font-size:21px}
    .kpis,.ventures,.health-top{grid-template-columns:1fr 1fr}
    .focus,.hgrid,.pcols,.appr,.chatwrap{grid-template-columns:1fr;height:auto}
    .preview{position:static}
    .filters{display:none}
    .profs{display:none}
    .pact .btn{flex:1 1 44%}
    .hrow{align-items:flex-start}
    .hrow > div:last-child{flex-wrap:wrap;gap:6px}
    .hrow .pill{white-space:nowrap}
    .arow{gap:8px;align-items:center}
    .arow .at{white-space:normal;font-size:12.5px;line-height:1.35}
    .arow .am{white-space:normal;font-size:11px;gap:4px}
    .arow .am .vdot{display:none}
    .thumb{width:38px;height:38px;flex:0 0 38px}
    .arow > span:last-child{display:none}
    .arow > .chip{font-size:10px;padding:1px 5px}
    .qhead .chip{display:none}
  }

</style>
</head>
<body data-theme="light">
<aside class="sidebar">
  <div class="brand">
    <div class="mark">S</div>
    <div><div class="bt">Sport</div><div class="bs">Command Center</div></div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="side-foot">
    <div class="avatar">DD</div>
    <div><div class="nm">Dan</div><div class="rl">Owner</div></div>
  </div>
</aside>

<div class="app">
  <div class="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="ask">🔎&nbsp; Ask Sport about anything… <span style="margin-left:auto;font-size:11px;opacity:.7">⌘K</span></div>
    <span class="pill ok" id="healthpill">● 11/11 services up</span>
    <span class="pill bad">100 approvals</span>
    <button class="btn sm" id="themeBtn" onclick="toggleTheme()">◐ Dark</button>
  </div>
  <div class="main"><div class="wrap" id="screen"></div></div>
</div>

<script>
const T = new URLSearchParams(location.search);
const SCREEN = T.get('s') || 'today';
if (T.get('theme')) document.body.dataset.theme = T.get('theme');

/* ---------------- data (real counts, Oct 21 2026) ---------------- */
const VENT = {
  tmg:    {name:'Track My Gold',      color:'var(--tmg)',   icon:'⛏️', sub:'Gold tracking · $2.99/mo'},
  peril:  {name:'Peril Adventure Wear',color:'var(--peril)',icon:'🏔️', sub:'Apparel · @peril_adventures'},
  deck:   {name:'TradeDeck',          color:'var(--deck)',  icon:'📈', sub:'Market desk · paper'},
  port:   {name:'Portfolio Engine',    color:'var(--port)',  icon:'🌐', sub:'Public showcase'},
  film:   {name:'Film Room',          color:'var(--film)',  icon:'🎬', sub:'Short-film desk'},
  gold:   {name:'Gold Spot Explorer', color:'var(--tmg)',   icon:'🗺️', sub:'LiDAR ground scoring'},
  home:   {name:'Smart Home',         color:'var(--green)', icon:'🏠', sub:'Home Assistant · Pi'},
