<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050810;color:#cbd5e1;font:13px/1.5 -apple-system,Inter,sans-serif}
h1{font-size:15px;padding:16px 18px;letter-spacing:-.3px;color:#e2e8f0}
.wrap{max-width:1120px;margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#111a2a;border:1px solid #1c2a44;border-radius:12px;padding:14px}
.card .h{font-size:11px;color:#64748b;letter-spacing:1px;margin-bottom:10px}
.stat{font-size:24px;font-weight:700;color:#f0f9ff;margin:2px 0}
.stat .l{font-size:11px;color:#64748c}
.note{font-size:11px;color:#64748b}
</style></head><body>
<h1>AI Consulting · Management Console · DEMO PANEL (Sample Data)</h1>
<div class="wrap">
  <div class="card"><div class="h">Intake</div><div class="stat">0</div><div class="l">new requests waiting</div></div>
  <div class="card"><div class="h">Open Kanban tasks</div><div class="stat">0</div><div class="l">demo board</div></div>
  <div class="card"><div class="h">Client accounts</div><div class="stat">0</div><div class="l">no real accounts shown</div></div>
  <div class="card"><div class="h">Integrations</div><div class="stat">0</div><div class="l">Fiverr / Upwork</div></div>
  <div class="card" style="grid-column:span 2">
    <div class="h">Pipeline</div>
    <div style="font-size:12px"><span style="color:#64748b">Request →</span> intake form <b style="color:#34d399">public-safe</b> <span style="color:#64748b">→</span> kanban triage <span style="color:#64748b">→</span> quote</div>
  </div>
</div>
</body></html>
