<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b14;color:#cbd5e1;font:13px/1.5 -apple-system,Inter,sans-serif}
w{font-size:15px;padding:16px 18px;letter-spacing:-.3px;color:#e2e8f0}
.wrap{max-width:1120px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.g{background:#111722;border:1px solid #1c2a44;border-radius:14px;padding:16px}
.g .h{font-size:11px;color:#64748b;letter-spacing:1px}
.row{display:flex;justify-content:space-between;font-size:12px;margin:7px 0}
.brb{width:100%;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;color:#fff;margin:8px 0;background:#2563eb}
.pos{color:#34d399}.neg{color:#f87171}
</style></head><body>
<div id="w">Net Worth Ledger — Sample Account (Demo User) · DEMO PANEL</div>
<div class="wrap">
  <div class="g">
    <div class="h">AGGREGATED NET WORTH · $0 (demo)</div>
    <div class="row"><span>Assets</span><b class="pos">$0.00</b></div>
    <div class="row"><span>Liabilities</span><b class="neg">$0.00</b></div>
    <button class="brb">Refresh balances</button>
    <div style="font-size:11px;color:#64748b;margin-top:6px">on-demand web refresh · auditable history</div>
  </div>
  <div class="g">
    <div class="h">CATEGORIES</div>
    <div class="row"><span>Checking</span><b>$0.00</b></div>
    <div class="row"><span>Investments (demo)</span><b>$0.00</b></div>
    <div class="row"><span>Loans (demo)</span><b>$0.00</b></div>
    <div style="font-size:11px;color:#64748b;margin-top:10px">SQLite · Node.js</div>
  </div>
</div>
</body></html>
